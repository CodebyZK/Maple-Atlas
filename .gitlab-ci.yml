image: node:20

stages:
  - test
  - deploy

cache:
  paths:
    - node_modules/

before_script:
  - npm ci

test:
  stage: test
  script:
    - npm test
    - npm run build

deploy-pages:
  stage: deploy
  script:
    - npm run build
    - mv dist public-site
  artifacts:
    paths:
      - public-site
  pages:
    publish: public-site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
