image: node:20

stages:
  - test
  - deploy

cache:
  paths:
    - node_modules/

before_script:
  - npm ci

test:
  stage: test
  script:
    - npm test
    - npm run build

deploy-pages:
  stage: deploy
  script:
    - npm run build
    - mv dist public-site
  artifacts:
    paths:
      - public-site
  pages:
    publish: public-site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_production:
  stage: deploy
  image: alpine:3.20
  resource_group: atlas-production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production
    url: https://atlas.zionkoudijs.com
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - if [ -f "$DEPLOY_SSH_KEY" ]; then cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519; else printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519; fi
    - |
      if ! ssh-keygen -lf ~/.ssh/id_ed25519 >/dev/null 2>&1; then
        normalized_key=$(mktemp)
        {
          printf '%s\n' '-----BEGIN OPENSSH PRIVATE KEY-----'
          sed -e '1s/^DEPLOY_SSH_KEY=//' \
            -e '/^-----BEGIN OPENSSH PRIVATE KEY-----$/d' \
            -e '/^-----END OPENSSH PRIVATE KEY-----$/d' \
            ~/.ssh/id_ed25519 | tr -d '[:space:]'
          printf '\n%s\n' '-----END OPENSSH PRIVATE KEY-----'
        } > "$normalized_key"
        if ssh-keygen -lf "$normalized_key" >/dev/null 2>&1; then
          mv "$normalized_key" ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
        else
          rm -f "$normalized_key"
          echo 'DEPLOY_SSH_KEY is not a valid OpenSSH private key' >&2
          exit 1
        fi
      fi
    - if [ -f "$DEPLOY_KNOWN_HOSTS" ]; then cp "$DEPLOY_KNOWN_HOSTS" ~/.ssh/known_hosts; else printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
    - chmod 600 ~/.ssh/id_ed25519
    - chmod 644 ~/.ssh/known_hosts
  script:
    - >-
      ssh -o BatchMode=yes -o StrictHostKeyChecking=yes
      "$DEPLOY_USER@$DEPLOY_HOST"
      "cd '$DEPLOY_PATH' && git fetch --prune origin && git reset --hard origin/$CI_DEFAULT_BRANCH && npm ci && VITE_DATA_API_URL=/api/v1 VITE_BEACON_API_URL=/api/beacon/v1 npm run build"
